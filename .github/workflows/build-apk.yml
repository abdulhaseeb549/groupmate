name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  EXPO_PUBLIC_SUPABASE_URL: https://ywcynwkhezupyqxsxshe.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_EpC39xdKU3pS8VlAYXZEcQ_9mnuzFLH

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Bake this run's build number into app.json
        run: |
          node -e "
            const fs = require('fs');
            const p = './app.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.expo.extra = Object.assign({}, j.expo.extra, { buildNumber: ${{ github.run_number }} });
            fs.writeFileSync(p, JSON.stringify(j, null, 2));
          "

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Raise Gradle/Kotlin memory limits for CI
        # expo prebuild regenerates android/gradle.properties from scratch
        # every run, so this has to happen after prebuild, not committed
        # into the repo. Without it, Kotlin/KSP compilation (expo-updates'
        # codegen in particular) hits OutOfMemoryError: Metaspace on the
        # runner's default heap and fails assembleRelease outright — this
        # was masked by the earlier daemon hang, which stopped the build
        # before this failure was visible. Workers capped to 2 as well, so
        # fewer JVMs compete for memory at once on a 2-core/7GB runner.
        run: |
          # Prebuild's gradle.properties has no trailing newline; without this, the first line below fuses onto expo.inlineModules.watchedDirectories and breaks its JSON.
          printf '\n' >> android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
          EOF
          echo "--- tail of gradle.properties ---"
          tail -6 android/gradle.properties

      - name: Build release APK
        working-directory: android
        # assembleRelease (not assembleDebug): a debug APK expects a live Metro
        # server on the dev machine and crashes with "Unable to load script"
        # once installed standalone — release embeds the JS bundle into the
        # APK itself. Still installs fine without a real signing key: Expo's
        # template points buildTypes.release at signingConfigs.debug by
        # default, so this stays a debug-keystore-signed APK, just with the
        # JS actually bundled in.
        #
        # --no-daemon: without it, the build finishes (see "N actionable
        # tasks: N executed" in the log) but the leftover Gradle daemon can
        # get stuck spinning on OutOfMemoryError: Metaspace in a background
        # thread and never exits, hanging the whole job well past when the
        # actual work is done. A one-shot CI run doesn't need a persistent
        # daemon anyway.
        #
        # NODE_OPTIONS: the failure is "Process 'command node' finished
        # with non-zero exit value 1" during the Metro/JS-bundling task —
        # plausibly the bundler itself running out of heap on this runner,
        # same underlying resource pressure as the Kotlin/KSP OOM above.
        #
        # Output piped to build.log (not just relied on in the Actions UI):
        # the web log viewer virtualizes long steps, so only whatever's
        # currently scrolled into view exists in the page at all — grepping
        # a real file in the next step is the reliable way to actually see
        # the failure instead of manually scrolling a huge collapsed step.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # set -o pipefail: without it, `cmd | tee file` reports tee's exit
        # status (always 0), not gradlew's — the previous run "succeeded"
        # in GitHub's UI even though Gradle itself printed BUILD FAILED,
        # which meant the if: failure() step below never fired and the
        # real cause stayed hidden in the log for another whole round trip.
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show the real error if the build failed
        if: failure()
        working-directory: android
        run: |
          echo "===== lines mentioning error/exception/failed ====="
          grep -inE 'error|exception|failed|node_modules.*not found|cannot find module' build.log | tail -100
          echo
          echo "===== last 150 lines of the full log ====="
          tail -150 build.log

      - name: List actual APK output (diagnostic)
        if: always()
        # The last successful build created no APK asset on the release —
        # softprops/action-gh-release doesn't fail on an unmatched glob by
        # default, it just silently attaches nothing. This prints whatever
        # actually exists so a wrong assumed path is visible immediately
        # instead of discovered by another blind guess-and-push cycle.
        # if: always() — run this regardless of whether the build step
        # above passed or failed, since both cases are worth seeing.
        run: find android/app/build/outputs -type f -name '*.apk' -o -type d -name outputs 2>&1 || true

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          # Glob instead of one exact path: catches app-release.apk,
          # app-release-unsigned.apk, or a differently-flavored output
          # without needing to guess the exact filename up front.
          files: android/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: true
